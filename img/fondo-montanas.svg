      <stop offset="0" stop-color="#26325a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#101829" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cercanas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset=".75" stop-color="#0f1626" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0d1420" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="filo" x1="0" y1="0" x2="1" y2="0">
